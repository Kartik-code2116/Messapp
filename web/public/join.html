<!DOCTYPE html>
<html>
<head>
    <title>Join Mess</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f8fafc; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        window.onload = function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            
            var playStoreUrl = "https://play.google.com/store/apps/details?id=com.kartik.messapp";
            if (code) {
                // Try to open the app via custom scheme
                window.location.href = "messapp://join?code=" + code;
                
                // Fallback to play store after 1.5 seconds if the app didn't open
                setTimeout(function() {
                    window.location.href = playStoreUrl;
                }, 1500);
            } else {
                window.location.href = playStoreUrl;
            }
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h2>Opening Messapp...</h2>
        <p style="color: #64748b; margin-top: 8px;">If the app doesn't open automatically, you will be redirected to the Play Store.</p>
    </div>
</body>
</html>
